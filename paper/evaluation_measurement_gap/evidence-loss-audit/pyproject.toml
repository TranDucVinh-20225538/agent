[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-loss-audit"
version = "0.1.0"
description = "Locate where a collect-then-filter evaluator needs human confirmation. Does not conclude that evidence was lost."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "evidence-loss-audit contributors" }]

[project.urls]
Homepage = "https://github.com"

[tool.setuptools.packages.find]
where = ["src"]
